<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 520" fill="none">
    <defs>
        <radialGradient id="glow" cx="50%" cy="50%" r="50%">
            <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.16"/>
            <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
        </radialGradient>
    </defs>

    <!-- 右下角光晕 -->
    <circle cx="316" cy="400" r="252" fill="url(#glow)"/>

    <!-- 以右下角为圆心的弧形 -->
    <g fill="none" stroke="#FFFFFF">
        <circle cx="430" cy="546" r="150" stroke-opacity="0.18"/>
        <circle cx="430" cy="546" r="228" stroke-opacity="0.12"/>
        <circle cx="430" cy="546" r="306" stroke-opacity="0.07"/>
    </g>

    <!-- 背景小卡 -->
    <g transform="rotate(-4 150 262)">
        <rect x="106" y="236" width="88" height="52" rx="14" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.10"/>
        <rect x="120" y="252" width="34" height="6" rx="3" fill="#FFFFFF" fill-opacity="0.22"/>
        <rect x="120" y="266" width="52" height="6" rx="3" fill="#FFFFFF" fill-opacity="0.12"/>
    </g>

    <!-- 数据小卡 -->
    <g transform="rotate(-8 255 352)">
        <rect x="150" y="292" width="210" height="120" rx="24" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.18"/>
        <rect x="174" y="316" width="56" height="7" rx="3.5" fill="#FFFFFF" fill-opacity="0.30"/>
        <g fill="#FFFFFF">
            <rect x="174" y="352" width="18" height="34" rx="5" fill-opacity="0.20"/>
            <rect x="202" y="338" width="18" height="48" rx="5" fill-opacity="0.26"/>
            <rect x="230" y="360" width="18" height="26" rx="5" fill-opacity="0.18"/>
            <rect x="258" y="330" width="18" height="56" rx="5" fill-opacity="0.34"/>
            <rect x="286" y="348" width="18" height="38" rx="5" fill-opacity="0.22"/>
            <rect x="314" y="322" width="18" height="64" rx="5" fill-opacity="0.40"/>
        </g>
    </g>

    <!-- 点阵 -->
    <g fill="#FFFFFF" fill-opacity="0.20">
        <circle cx="34" cy="352" r="1.7"/><circle cx="58" cy="352" r="1.7"/><circle cx="82" cy="352" r="1.7"/>
        <circle cx="34" cy="376" r="1.7"/><circle cx="58" cy="376" r="1.7"/><circle cx="82" cy="376" r="1.7"/>
        <circle cx="34" cy="400" r="1.7"/><circle cx="58" cy="400" r="1.7"/><circle cx="82" cy="400" r="1.7"/>
        <circle cx="34" cy="424" r="1.7"/><circle cx="58" cy="424" r="1.7"/><circle cx="82" cy="424" r="1.7"/>
    </g>
</svg>
